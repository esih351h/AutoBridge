
name: Build AutoBridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/autobridge/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoBridge"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.autobridge.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.autobridge.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="AutoBridge"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BridgeAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="AutoBridge touch service">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#10243A</item>
                  <item name="android:navigationBarColor">#10243A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AutoBridge</string>
              <string name="accessibility_description">Allows AutoBridge to perform touch gestures when automation is explicitly started.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"/>
          EOF

          cat > app/src/main/java/com/autobridge/app/MainActivity.java <<'EOF'
          package com.autobridge.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private TextView serviceStatus;
              private TextView stageStatus;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(22), dp(28), dp(22), dp(22));
                  page.setBackgroundColor(0xFF101C2B);

                  TextView title = text("AutoBridge", 28, 0xFFFFFFFF);
                  title.setGravity(Gravity.CENTER);
                  page.addView(title);

                  TextView subtitle = text(
                      "Early testing build - v0.1.0", 14, 0xFFB8C7D9);
                  subtitle.setGravity(Gravity.CENTER);
                  page.addView(subtitle);

                  serviceStatus = text("", 16, 0xFFFFFFFF);
                  page.addView(serviceStatus);

                  stageStatus = text("", 15, 0xFFFFD180);
                  page.addView(stageStatus);

                  Button settings = new Button(this);
                  settings.setText("Open Accessibility settings");
                  settings.setOnClickListener(v ->
                      startActivity(new Intent(
                          Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  page.addView(settings);

                  Button refresh = new Button(this);
                  refresh.setText("Refresh service status");
                  refresh.setOnClickListener(v -> updateStatus());
                  page.addView(refresh);

                  TextView info = text(
                      "This first build verifies that AutoBridge installs and " +
                      "can detect its Accessibility-service permission. " +
                      "Automatic game recognition, blue-dot detection, pole " +
                      "measurement, touch automation, result recognition " +
                      "and learning are not implemented yet. They will be " +
                      "added and tested in later milestones.",
                      15, 0xFFD6E0EA);

                  info.setPadding(0, dp(22), 0, 0);
                  page.addView(info);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(page);
                  setContentView(scroll);

                  updateStatus();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateStatus();
              }

              private void updateStatus() {
                  boolean enabled =
                      BridgeAccessibilityService.isEnabled(this);

                  serviceStatus.setText(
                      "Touch service: " +
                      (enabled ? "ENABLED" : "NOT ENABLED"));

                  serviceStatus.setTextColor(
                      enabled ? 0xFF81C784 : 0xFFFFCC80);

                  stageStatus.setText(enabled
                      ? "Foundation ready - automation not implemented"
                      : "Enable Accessibility service to prepare for testing");
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(0, dp(10), 0, dp(10));
                  return t;
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

          cat > app/src/main/java/com/autobridge/app/BridgeAccessibilityService.java <<'EOF'
          package com.autobridge.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.accessibility.AccessibilityEvent;

          public class BridgeAccessibilityService extends AccessibilityService {

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Game recognition will be added in a later milestone.
              }

              @Override
              public void onInterrupt() {
                  // This foundation build does not initiate gestures.
              }

              public static boolean isEnabled(Context context) {
                  String enabled = Settings.Secure.getString(
                      context.getContentResolver(),
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);

                  if (TextUtils.isEmpty(enabled)) {
                      return false;
                  }

                  ComponentName expected = new ComponentName(
                      context, BridgeAccessibilityService.class);

                  TextUtils.SimpleStringSplitter splitter =
                      new TextUtils.SimpleStringSplitter(':');

                  splitter.setString(enabled);

                  while (splitter.hasNext()) {
                      ComponentName item =
                          ComponentName.unflattenFromString(
                              splitter.next());

                      if (expected.equals(item)) {
                          return true;
                      }
                  }

                  return false;
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
