
name: Build AutoBridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/autobridge/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoBridge"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.autobridge.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.autobridge.app'
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName '0.3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>

              <application
                  android:allowBackup="true"
                  android:label="AutoBridge"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BridgeAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="AutoBridge touch service">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>

                  <service
                      android:name=".ScreenCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#10243A</item>
                  <item name="android:navigationBarColor">#10243A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AutoBridge</string>
              <string name="accessibility_description">Allows AutoBridge to perform touch gestures when automation is explicitly started.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"/>
          EOF

          cat > app/src/main/java/com/autobridge/app/BridgeAccessibilityService.java <<'EOF'
          package com.autobridge.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.accessibility.AccessibilityEvent;

          public class BridgeAccessibilityService extends AccessibilityService {

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Game automation is not enabled in this version.
              }

              @Override
              public void onInterrupt() {
                  // No automated gestures in this version.
              }

              public static boolean isEnabled(Context context) {
                  String enabled = Settings.Secure.getString(
                      context.getContentResolver(),
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);

                  if (TextUtils.isEmpty(enabled)) return false;

                  ComponentName expected = new ComponentName(
                      context, BridgeAccessibilityService.class);

                  TextUtils.SimpleStringSplitter splitter =
                      new TextUtils.SimpleStringSplitter(':');

                  splitter.setString(enabled);

                  while (splitter.hasNext()) {
                      ComponentName item =
                          ComponentName.unflattenFromString(splitter.next());

                      if (expected.equals(item)) return true;
                  }

                  return false;
              }
          }
          EOF

          cat > app/src/main/java/com/autobridge/app/MainActivity.java <<'EOF'
          package com.autobridge.app;

          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int REQUEST_CAPTURE = 1001;
              private static final int SAMPLE_STEP = 2;

              private TextView serviceStatus;
              private TextView captureStatus;
              private TextView detectionStatus;
              private ImageView preview;
              private BroadcastReceiver receiver;
              private boolean receiverRegistered = false;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(18), dp(20), dp(18), dp(24));
                  page.setBackgroundColor(0xFF101C2B);

                  TextView title = text("AutoBridge", 27, 0xFFFFFFFF);
                  title.setGravity(Gravity.CENTER);
                  page.addView(title);

                  TextView version = text(
                      "Blue-dot detection test - v0.3.0",
                      14, 0xFFB8C7D9);
                  version.setGravity(Gravity.CENTER);
                  page.addView(version);

                  serviceStatus = text("", 15, 0xFFFFFFFF);
                  page.addView(serviceStatus);

                  Button accessibility = new Button(this);
                  accessibility.setText("Accessibility settings");
                  accessibility.setOnClickListener(v ->
                      startActivity(new Intent(
                          Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  page.addView(accessibility);

                  captureStatus = text(
                      "Capture: stopped", 15, 0xFFFFD180);
                  page.addView(captureStatus);

                  Button start = new Button(this);
                  start.setText("Start Continuous Capture");
                  start.setOnClickListener(v -> requestCapture());
                  page.addView(start);

                  Button stop = new Button(this);
                  stop.setText("Stop Capture");
                  stop.setOnClickListener(v -> stopCapture());
                  page.addView(stop);

                  detectionStatus = text(
                      "Blue markers: waiting for screenshot",
                      14, 0xFF80CBC4);
                  page.addView(detectionStatus);

                  preview = new ImageView(this);
                  preview.setAdjustViewBounds(true);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  preview.setBackgroundColor(0xFF26384A);

                  page.addView(preview,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(300)));

                  TextView explanation = text(
                      "Blue candidates are approximate image detections. " +
                      "They are not yet classified as Dot A or Dot B. " +
                      "No automatic game input is performed.",
                      13, 0xFFD6E0EA);
                  page.addView(explanation);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(page);
                  setContentView(scroll);

                  registerReceiver();
                  updateServiceStatus();
              }

              private void requestCapture() {
                  MediaProjectionManager manager =
                      (MediaProjectionManager) getSystemService(
                          Context.MEDIA_PROJECTION_SERVICE);

                  startActivityForResult(
                      manager.createScreenCaptureIntent(),
                      REQUEST_CAPTURE);
              }

              @Override
              protected void onActivityResult(
                  int requestCode, int resultCode, Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != REQUEST_CAPTURE) return;

                  if (resultCode != RESULT_OK || data == null) {
                      setStatus("Capture: permission denied");
                      return;
                  }

                  stopService(new Intent(this, ScreenCaptureService.class));

                  Intent service = new Intent(
                      this, ScreenCaptureService.class);

                  service.putExtra("resultCode", resultCode);
                  service.putExtra("captureData", data);

                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(service);
                      } else {
                          startService(service);
                      }

                      setStatus("Capture: starting");

                  } catch (Exception e) {
                      setStatus("Capture failed: " +
                          e.getClass().getSimpleName());
                  }
              }

              private void stopCapture() {
                  stopService(new Intent(this, ScreenCaptureService.class));
                  setStatus("Capture: stopped");
              }

              private void registerReceiver() {
                  receiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(
                          Context context, Intent intent) {

                          String action = intent.getAction();

                          if (ScreenCaptureService.ACTION_STATUS.equals(action)) {
                              String message =
                                  intent.getStringExtra("message");

                              if (message != null) setStatus(message);
                              return;
                          }

                          if (ScreenCaptureService.ACTION_FRAME.equals(action)) {
                              String path =
                                  intent.getStringExtra("filePath");

                              if (path == null) return;

                              File file = new File(path);

                              if (!file.exists()) return;

                              Bitmap bitmap =
                                  BitmapFactory.decodeFile(path);

                              if (bitmap == null) {
                                  setStatus("Capture error: cannot decode image");
                                  return;
                              }

                              preview.setImageBitmap(bitmap);
                              updateDetection(bitmap);
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(ScreenCaptureService.ACTION_FRAME);
                  filter.addAction(ScreenCaptureService.ACTION_STATUS);

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                          receiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(receiver, filter);
                  }

                  receiverRegistered = true;
              }

              private void updateDetection(Bitmap bitmap) {
                  List<Candidate> candidates = findBlueCandidates(bitmap);

                  StringBuilder result = new StringBuilder();
                  result.append("Blue candidates: ")
                      .append(candidates.size());

                  int shown = Math.min(10, candidates.size());

                  for (int i = 0; i < shown; i++) {
                      Candidate c = candidates.get(i);

                      result.append("\\n")
                          .append(i + 1)
                          .append(". X=")
                          .append(c.x)
                          .append(" Y=")
                          .append(c.y)
                          .append(" Confidence=")
                          .append(c.confidence)
                          .append("%");
                  }

                  if (candidates.isEmpty()) {
                      result.append("\\nNo blue candidates found.");
                  }

                  detectionStatus.setText(result.toString());
              }

              private List<Candidate> findBlueCandidates(Bitmap bitmap) {
                  int width = bitmap.getWidth();
                  int height = bitmap.getHeight();

                  int gridW = (width + SAMPLE_STEP - 1) / SAMPLE_STEP;
                  int gridH = (height + SAMPLE_STEP - 1) / SAMPLE_STEP;
                  int total = gridW * gridH;

                  boolean[] blue = new boolean[total];
                  boolean[] visited = new boolean[total];

                  for (int gy = 0; gy < gridH; gy++) {
                      int y = Math.min(gy * SAMPLE_STEP, height - 1);

                      for (int gx = 0; gx < gridW; gx++) {
                          int x = Math.min(gx * SAMPLE_STEP, width - 1);
                          int color = bitmap.getPixel(x, y);

                          blue[gy * gridW + gx] = isBlue(color);
                      }
                  }

                  int[] queue = new int[total];
                  List<Candidate> found = new ArrayList<>();

                  for (int start = 0; start < total; start++) {
                      if (!blue[start] || visited[start]) continue;

                      int head = 0;
                      int tail = 0;

                      queue[tail++] = start;
                      visited[start] = true;

                      int minX = gridW;
                      int maxX = 0;
                      int minY = gridH;
                      int maxY = 0;
                      int count = 0;

                      while (head < tail) {
                          int index = queue[head++];
                          int x = index % gridW;
                          int y = index / gridW;

                          count++;

                          minX = Math.min(minX, x);
                          maxX = Math.max(maxX, x);
                          minY = Math.min(minY, y);
                          maxY = Math.max(maxY, y);

                          for (int dy = -1; dy <= 1; dy++) {
                              for (int dx = -1; dx <= 1; dx++) {
                                  if (dx == 0 && dy == 0) continue;

                                  int nx = x + dx;
                                  int ny = y + dy;

                                  if (nx < 0 || ny < 0 ||
                                      nx >= gridW || ny >= gridH) continue;

                                  int next = ny * gridW + nx;

                                  if (blue[next] && !visited[next]) {
                                      visited[next] = true;
                                      queue[tail++] = next;
                                  }
                              }
                          }
                      }

                      int boxW = maxX - minX + 1;
                      int boxH = maxY - minY + 1;
                      int boxArea = boxW * boxH;

                      if (count < 3 || count > 350) continue;
                      if (boxW > 35 || boxH > 35) continue;

                      float ratio = (float) boxW / (float) boxH;

                      if (ratio < 0.45f || ratio > 2.2f) continue;

                      float fill = (float) count / boxArea;
                      int confidence = Math.min(
                          99, Math.round(fill * 100));

                      int centerX = (minX + maxX) / 2 * SAMPLE_STEP;
                      int centerY = (minY + maxY) / 2 * SAMPLE_STEP;

                      found.add(new Candidate(
                          centerX, centerY, confidence, count));
                  }

                  Collections.sort(found,
                      (a, b) -> Integer.compare(b.area, a.area));

                  return found;
              }

              private boolean isBlue(int color) {
                  int r = Color.red(color);
                  int g = Color.green(color);
                  int b = Color.blue(color);

                  return b >= 125 &&
                      b > r * 1.30 &&
                      b > g * 1.08 &&
                      r < 150;
              }

              private void setStatus(String message) {
                  if (captureStatus != null) {
                      captureStatus.setText(message);
                  }
              }

              private void updateServiceStatus() {
                  boolean enabled =
                      BridgeAccessibilityService.isEnabled(this);

                  serviceStatus.setText(
                      "Touch service: " +
                      (enabled ? "ENABLED" : "NOT ENABLED"));

                  serviceStatus.setTextColor(
                      enabled ? 0xFF81C784 : 0xFFFFCC80);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (serviceStatus != null) updateServiceStatus();
              }

              @Override
              protected void onDestroy() {
                  if (receiverRegistered) {
                      unregisterReceiver(receiver);
                      receiverRegistered = false;
                  }

                  super.onDestroy();
              }

              private TextView text(
                  String value, int size, int color) {

                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(0, dp(9), 0, dp(9));
                  return t;
              }

              private int dp(int value) {
                  return Math.round(
                      value * getResources().getDisplayMetrics().density);
              }

              private static class Candidate {
                  final int x;
                  final int y;
                  final int confidence;
                  final int area;

                  Candidate(int x, int y, int confidence, int area) {
                      this.x = x;
                      this.y = y;
                      this.confidence = confidence;
                      this.area = area;
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/autobridge/app/ScreenCaptureService.java <<'EOF'
          package com.autobridge.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;

          import java.io.File;
          import java.io.FileOutputStream;

          public class ScreenCaptureService extends Service {

              public static final String ACTION_FRAME =
                  "com.autobridge.app.SCREEN_FRAME";

              public static final String ACTION_STATUS =
                  "com.autobridge.app.CAPTURE_STATUS";

              private static final String CHANNEL_ID = "autobridge_capture";
              private static final int NOTIFICATION_ID = 202;

              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private HandlerThread workerThread;
              private Handler worker;

              private long lastFrameTime = 0;
              private boolean stopping = false;

              @Override
              public void onCreate() {
                  super.onCreate();

                  workerThread = new HandlerThread("AutoBridgeCapture");
                  workerThread.start();
                  worker = new Handler(workerThread.getLooper());

                  createNotificationChannel();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  int resultCode = intent.getIntExtra("resultCode", 0);
                  Intent data = intent.getParcelableExtra("captureData");

                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(
                              NOTIFICATION_ID,
                              buildNotification(),
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                      } else {
                          startForeground(
                              NOTIFICATION_ID, buildNotification());
                      }

                      MediaProjectionManager manager =
                          (MediaProjectionManager) getSystemService(
                              Context.MEDIA_PROJECTION_SERVICE);

                      projection = manager.getMediaProjection(resultCode, data);

                      if (projection == null) {
                          sendStatus("Capture failed: projection unavailable");
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      projection.registerCallback(
                          new MediaProjection.Callback() {
                              @Override
                              public void onStop() {
                                  sendStatus("Capture stopped by Android");
                                  stopSelf();
                              }
                          }, worker);

                      sendStatus("Permission accepted - starting continuous capture");

                      beginCapture();

                  } catch (Exception e) {
                      sendStatus("Capture failed: " +
                          e.getClass().getSimpleName());
                      stopSelf();
                  }

                  return START_NOT_STICKY;
              }

              private void beginCapture() {
                  try {
                      WindowManager wm =
                          (WindowManager) getSystemService(WINDOW_SERVICE);

                      DisplayMetrics metrics = new DisplayMetrics();
                      wm.getDefaultDisplay().getRealMetrics(metrics);

                      int width = metrics.widthPixels;
                      int height = metrics.heightPixels;
                      int density = metrics.densityDpi;

                      imageReader = ImageReader.newInstance(
                          width, height, PixelFormat.RGBA_8888, 3);

                      imageReader.setOnImageAvailableListener(
                          this::receiveFrame, worker);

                      virtualDisplay = projection.createVirtualDisplay(
                          "AutoBridgeScreen",
                          width,
                          height,
                          density,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader.getSurface(),
                          null,
                          worker);

                      sendStatus("Continuous capture active");

                  } catch (Exception e) {
                      sendStatus("Capture setup failed: " +
                          e.getClass().getSimpleName());
                      stopSelf();
                  }
              }

              private void receiveFrame(ImageReader reader) {
                  if (stopping) return;

                  long now = System.currentTimeMillis();

                  // Limit processing to approximately two frames per second.
                  if (now - lastFrameTime < 500) {
                      Image discarded = reader.acquireLatestImage();
                      if (discarded != null) discarded.close();
                      return;
                  }

                  Image image = null;

                  try {
                      image = reader.acquireLatestImage();
                      if (image == null) return;

                      lastFrameTime = now;

                      Image.Plane plane = image.getPlanes()[0];

                      int pixelStride = plane.getPixelStride();
                      int rowStride = plane.getRowStride();
                      int width = image.getWidth();
                      int height = image.getHeight();

                      int rowPadding =
                          rowStride - pixelStride * width;

                      int paddedWidth =
                          width + rowPadding / pixelStride;

                      Bitmap padded = Bitmap.createBitmap(
                          paddedWidth,
                          height,
                          Bitmap.Config.ARGB_8888);

                      padded.copyPixelsFromBuffer(plane.getBuffer());

                      Bitmap bitmap = Bitmap.createBitmap(
                          padded, 0, 0, width, height);

                      if (bitmap != padded) padded.recycle();

                      File output = new File(
                          getCacheDir(), "autobridge_latest.jpg");

                      FileOutputStream stream =
                          new FileOutputStream(output);

                      try {
                          boolean saved = bitmap.compress(
                              Bitmap.CompressFormat.JPEG, 85, stream);

                          stream.flush();

                          if (!saved) {
                              throw new IllegalStateException(
                                  "JPEG compression failed");
                          }
                      } finally {
                          stream.close();
                          bitmap.recycle();
                      }

                      Intent broadcast = new Intent(ACTION_FRAME);
                      broadcast.setPackage(getPackageName());
                      broadcast.putExtra(
                          "filePath", output.getAbsolutePath());

                      sendBroadcast(broadcast);

                  } catch (Exception e) {
                      sendStatus("Frame error: " +
                          e.getClass().getSimpleName());

                  } finally {
                      if (image != null) image.close();
                  }
              }

              private void sendStatus(String message) {
                  Intent status = new Intent(ACTION_STATUS);
                  status.setPackage(getPackageName());
                  status.putExtra("message", message);
                  sendBroadcast(status);
              }

              private Notification buildNotification() {
                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  return builder
                      .setContentTitle("AutoBridge screen capture")
                      .setContentText("Continuous game-screen analysis")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setOngoing(true)
                      .build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "AutoBridge capture",
                              NotificationManager.IMPORTANCE_LOW);

                      NotificationManager manager =
                          getSystemService(NotificationManager.class);

                      manager.createNotificationChannel(channel);
                  }
              }

              @Override
              public void onDestroy() {
                  stopping = true;

                  if (virtualDisplay != null) {
                      virtualDisplay.release();
                      virtualDisplay = null;
                  }

                  if (imageReader != null) {
                      imageReader.close();
                      imageReader = null;
                  }

                  if (projection != null) {
                      projection.stop();
                      projection = null;
                  }

                  if (workerThread != null) {
                      workerThread.quitSafely();
                      workerThread = null;
                  }

                  stopForeground(true);
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBridge-v0.3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
